alues \"\" \"${BIJUX_PYPI_PYTHON_VERSION:-}\" \"${{ vars.BIJUX_PYPI_PYTHON_VERSION || '' }}\" \"3.11\")\"\nsetup_rust=\"$(bool_from_values \"\" \"${BIJUX_PYPI_SETUP_RUST:-}\" \"${{ vars.BIJUX_PYPI_SETUP_RUST || '' }}\" \"true\")\"\nrelease_rust_toolchain=\"$(from_values \"\" \"${BIJUX_RELEASE_RUST_TOOLCHAIN:-}\" \"${{ vars.BIJUX_RELEASE_RUST_TOOLCHAIN || '' }}\" \"1.86.0\")\"\nrust_toolchain=\"$(from_values \"\" \"${BIJUX_PYPI_RUST_TOOLCHAIN:-}\" \"${{ vars.BIJUX_PYPI_RUST_TOOLCHAIN || '' }}\" \"${release_rust_toolchain}\")\"\nmaturin_version=\"$(from_values \"\" \"${BIJUX_PYPI_MATURIN_VERSION:-}\" \"${{ vars.BIJUX_PYPI_MATURIN_VERSION || '' }}\" \"v1.12.6\")\"\ncache_dependency_path=\"$(from_values \"\" \"${BIJUX_PYPI_CACHE_DEPENDENCY_PATH:-}\" \"${{ vars.BIJUX_PYPI_CACHE_DEPENDENCY_PATH || '' }}\" \"crates/bijux-cli-python/pyproject.toml\")\"\nmanifest_path=\"$(from_values \"\" \"${BIJUX_PYPI_MANIFEST_PATH:-}\" \"${{ vars.BIJUX_PYPI_MANIFEST_PATH || '' }}\" \"crates/bijux-cli-python/Cargo.toml\")\"\npython_interpreter=\"$(from_values \"\" \"${BIJUX_PYPI_INTERPRETER:-}\" \"${{ vars.BIJUX_PYPI_INTERPRETER || '' }}\" \"python3.11\")\"\n\nif [[ \"${mode}\" != \"maturin\" && \"${mode}\" != \"artifact\" ]]; then\n  echo \"Unsupported BIJUX_PYPI_MODE: ${mode}\" >&2\n  exit 1\nfi\n\nbuild_matrix_json=\"$(filter_matrix \"${build_matrix_json}\" \"${allowed_packages}\")\"\npackage_matrix_json=\"$(filter_matrix \"${package_matrix_json}\" \"${allowed_packages}\")\"\n\nif [[ \"${mode}\" == \"artifact\" && ( \"${build_matrix_json}\" == \"[]\" || \"${package_matrix_json}\" == \"[]\" ) ]]; then\n  enabled=\"false\"\nfi\n\nif [[ \"${GITHUB_EVENT_NAME}\" == \"workflow_dispatch\" && \"${enabled}\" != \"true\" ]]; then\n  echo \"Manual dispatch resolved to a no-op release-pypi run.\" >&2\n  echo \"Set enabled=true and ensure release matrices resolve to at least one package.\" >&2\n  exit 1\nfi\n\n{\n  echo \"release_tag=${release_tag}\"\n  echo \"enabled=${enabled}\"\n  echo \"mode=${mode}\"\n  echo \"allowed_packages=${allowed_packages}\"\n  echo \"artifact_suffix=${artifact_suffix}\"\n  echo \"environment_name=${environment_name}\"\n  echo \"publish_auth_default=${publish_auth_default}\"\n  echo \"skip_existing=${skip_existing}\"\n  echo \"allow_token_bootstrap_on_missing=${allow_token_bootstrap_on_missing}\"\n  echo \"wait_for_ci_command=${wait_for_ci_command}\"\n  echo \"verification_command=${verification_command}\"\n  echo \"plan_command=${plan_command}\"\n  echo \"prepare_command=${prepare_command}\"\n  echo \"publish_command=${publish_command}\"\n  echo \"setup_python=${setup_python}\"\n  echo \"python_version=${python_version}\"\n  echo \"setup_rust=${setup_rust}\"\n  echo \"rust_toolchain=${rust_toolchain}\"\n  echo \"maturin_version=${maturin_version}\"\n  echo \"cache_dependency_path=${cache_dependency_path}\"\n  echo \"manifest_path=${manifest_path}\"\n  echo \"python_interpreter=${python_interpreter}\"\n  echo \"build_matrix_json<<EOF\"\n  printf '%s\\n' \"${build_matrix_json}\"\n  echo \"EOF\"\n  echo \"package_matrix_json<<EOF\"\n  printf '%s\\n' \"${package_matrix_json}\"\n  echo \"EOF\"\n} >> \"$GITHUB_OUTPUT\"\n"
    "needs":
