        "run": "set -euo pipefail\n\nif [[ -f \".github/release.env\" ]]; then\n  # shellcheck disable=SC1091\n  source \".github/release.env\"\nfi\n\nnon_empty() {\n  local value=\"$1\"\n  [[ -n \"${value// }\" ]]\n}\n\nfrom_values() {\n  local input_value=\"$1\"\n  local env_value=\"$2\"\n  local repo_var_value=\"$3\"\n  local default_value=\"$4\"\n  if non_empty \"$input_value\"; then\n    printf '%s\\n' \"$input_value\"\n    return\n  fi\n  if non_empty \"$env_value\"; then\n    printf '%s\\n' \"$env_value\"\n    return\n  fi\n  if non_empty \"$repo_var_value\"; then\n    printf '%s\\n' \"$repo_var_value\"\n    return\n  fi\n  printf '%s\\n' \"$default_value\"\n}\n\nbool_from_values() {\n  local input_value=\"$1\"\n  local env_value=\"$2\"\n  local repo_var_value=\"$3\"\n  local default_value=\"$4\"\n  local raw\n  raw=\"$(from_values \"$input_value\" \"$env_value\" \"$repo_var_value\" \"$default_value\")\"\n  case \"${raw,,}\" in\n    true|1|yes|on) printf 'true\\n' ;;\n    false|0|no|off) printf 'false\\n' ;;\n    *) printf '%s\\n' \"$default_value\" ;;\n  esac\n}\n\nnormalize_bool_optional() {\n  local raw=\"$1\"\n  case \"${raw,,}\" in\n    true|1|yes|on) printf 'true\\n' ;;\n    false|0|no|off) printf 'false\\n' ;;\n    ''|null) printf '\\n' ;;\n    *) printf '\\n' ;;\n  esac\n}\n\nfilter_matrix() {\n  local raw=\"$1\"\n  local allowed_raw=\"$2\"\n  python3 - \"$raw\" \"$allowed_raw\" <<'PY'\nimport json\nimport re\nimport sys\n\nraw = sys.argv[1]\nallowed_raw = sys.argv[2]\ntry:\n    value = json.loads(raw)\nexcept Exception as exc:  # pragma: no cover\n    raise SystemExit(f\"Invalid matrix JSON: {exc}\")\nif not isinstance(value, list):\n    raise SystemExit(\"Matrix JSON must be a JSON array\")\nfor index, item in enumerate(value):\n    if not isinstance(item, dict):\n        raise SystemExit(f\"Matrix entry {index} must be an object\")\n    if \"package_slug\" not in item or not str(item[\"package_slug\"]).strip():\n        raise SystemExit(f\"Matrix entry {index} missing package_slug\")\n\nallowed = {\n    part.strip()\n    for part in re.split(r\"[\\s,;]+\", allowed_raw.strip())\n    if part.strip()\n}\nif allowed:\n    value = [item for item in value if str(item.get(\"package_slug\", \"\")).strip() in allowed]\n\nprint(json.dumps(value, separators=(\",\", \":\")))\nPY\n}\n\nif [[ \"${GITHUB_REF_TYPE:-}\" == \"tag\" ]]; then\n  default_tag=\"${GITHUB_REF_NAME}\"\nelse\n  default_tag=\"\"\nfi\n\ninput_enabled=\"$(normalize_bool_optional \"${INPUT_ENABLED_RAW}\")\"\nif [[ -z \"${input_enabled}\" ]]; then\n  input_enabled=\"$(normalize_bool_optional \"${DISPATCH_ENABLED_RAW}\")\"\nfi\n\ninput_skip_existing=\"$(normalize_bool_optional \"${INPUT_SKIP_EXISTING_RAW}\")\"\nif [[ -z \"${input_skip_existing}\" ]]; then\n  input_skip_existing=\"$(normalize_bool_optional \"${DISPATCH_SKIP_EXISTING_RAW}\")\"\nfi\ninput_allow_token_bootstrap_on_missing=\"$(normalize_bool_optional \"${INPUT_ALLOW_TOKEN_BOOTSTRAP_ON_MISSING_RAW}\")\"\nif [[ -z \"${input_allow_token_bootstrap_on_missing}\" ]]; then\n  input_allow_token_bootstrap_on_missing=\"$(normalize_bool_optional \"${DISPATCH_ALLOW_TOKEN_BOOTSTRAP_ON_MISSING_RAW}\")\"\nfi\n\nrelease_tag=\"$(from_values \"${INPUT_RELEASE_TAG}\" \"${BIJUX_PYPI_RELEASE_TAG:-}\" \"${{ vars.BIJUX_PYPI_RELEASE_TAG || '' }}\" \"$default_tag\")\"\nenabled=\"$(bool_from_values \"${input_enabled}\" \"${BIJUX_PYPI_ENABLED:-}\" \"${{ vars.BIJUX_PYPI_ENABLED || '' }}\" \"false\")\"\nmode=\"$(from_values \"${INPUT_MODE}\" \"${BIJUX_PYPI_MODE:-}\" \"${{ vars.BIJUX_PYPI_MODE || '' }}\" \"maturin\")\"\nbuild_matrix_json=\"$(from_values \"${INPUT_BUILD_MATRIX_JSON}\" \"${BIJUX_RELEASE_BUILD_MATRIX_JSON:-}\" \"${{ vars.BIJUX_RELEASE_BUILD_MATRIX_JSON || '' }}\" \"[]\")\"\npackage_matrix_json=\"$(from_values \"${INPUT_PACKAGE_MATRIX_JSON}\" \"${BIJUX_PYPI_PACKAGE_MATRIX_JSON:-}\" \"${{ vars.BIJUX_PYPI_PACKAGE_MATRIX_JSON || '' }}\" \"[]\")\"\nallowed_packages=\"$(from_values \"\" \"${BIJUX_PYPI_ALLOWED_PACKAGE