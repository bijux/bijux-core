        "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        "with":
          "name": "native-python-reports"
          "path": "artifacts/native-tests/python-test"
          "retention-days": 7
          "compression-level": 0
          "if-no-files-found": "error"
        "if": "${{ always() }}"
    "if": "${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh')) }}"
  "test":
    "name": "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}test"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 5
    "env":
      "CARGO_HOME": "${{ github.workspace }}/artifacts/native-tests/cargo-home"
      "CARGO_INCREMENTAL": "0"
      "NATIVE_MANIFEST_SHA256": "${{ needs.test_plan.outputs.manifest_sha256 }}"
      "NATIVE_PLAN_SHA256": "${{ needs.test_plan.outputs.plan_sha256 }}"
      "NATIVE_JOB_RESULTS": "${{ toJSON(needs.*.result) }}"
      "NATIVE_LIBRARIES_SECONDS": "${{ needs.test_libraries.outputs.seconds }}"
      "NATIVE_BINARIES_SECONDS": "${{ needs.test_binaries.outputs.seconds }}"
      "NATIVE_TOOLS_SECONDS": "${{ needs.test_tools.outputs.seconds }}"
    "needs":
      - "test_plan"
      - "test_libraries"
      - "test_binaries"
      - "test_tools"
      - "test_rust"
      - "test_python"
    "if": "${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (always()) }}"
    "steps":
      - "name": "Check out the repository"
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - "name": "Set up Python"
        "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0"
        "with":
          "python-version": "3.11"
      - "name": "Set up Rust"
        "uses": "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8"
        "with":
          "toolchain": "${{ env.RUST_TOOLCHAIN_VERSION }}"
      - "name": "Download native-inputs"
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "name": "native-inputs"
          "path": "artifacts/native-tests"
      - "name": "Download complete native worker evidence"
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        "with":
          "pattern": "native-*proof*"
          "path": "artifacts/native-tests/results"
          "merge-multiple": true
      - "name": "Require every source-bound Rust and Python result"
        "run": "make gh-test TEST_CHECK=\"accept\""
      - "name": "Retain native-acceptance"
        "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        "with":
          "name": "native-acceptance"
          "path": "artifacts/native-tests/acceptance.json"
          "retention-days": 7
          "compression-level": 0
          "if-no-files-found": "error"
