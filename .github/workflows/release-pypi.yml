        "run": "set -euo pipefail\nmode='${{ matrix.publish_auth }}'\nif [[ -z \"${mode}\" ]]; then\n  mode='${{ needs.resolve.outputs.publish_auth_default }}'\nfi\ncase \"${mode}\" in\n  trusted|token) ;;\n  *)\n    echo \"Unsupported publish auth mode: ${mode}\" >&2\n    echo \"Expected one of: trusted, token\" >&2\n    exit 1\n    ;;\nesac\necho \"mode=${mode}\" >> \"$GITHUB_OUTPUT\"\n"
