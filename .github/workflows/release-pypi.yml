        "env":
          "PYPI_API_TOKEN_PRESENT": "${{ secrets.PYPI_API_TOKEN != '' }}"
        "uses": "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33"
        "with":
          "packages-dir": ".github/tmp/${{ matrix.package_slug }}-dist"
          "skip-existing": "${{ needs.resolve.outputs.skip_existing == 'true' }}"
          "user": "__token__"
          "password": "${{ secrets.PYPI_API_TOKEN }}"
      - "name": "Fail on indeterminate PyPI probe"
        "if": "${{ steps.auth.outputs.mode != 'token' && steps.trusted_publish.outcome == 'failure' && steps.pypi_project.outputs.probe_status == 'error' }}"
        "shell": "bash"
        "run": "set -euo pipefail\necho \"Trusted publish failed and PyPI probe result was indeterminate.\" >&2\necho \"Refusing token bootstrap for safety; retry later or force token mode explicitly.\" >&2\nexit 1\n"
      - "name": "Validate publish mode resolution"
        "if": "${{ steps.auth.outputs.mode != 'token' && steps.trusted_publish.outcome == 'failure' && steps.token_publish.outcome != 'success' }}"
        "shell": "bash"
        "run": "set -euo pipefail\necho \"Trusted publish failed and token bootstrap did not succeed.\" >&2\necho \"Set PYPI_API_TOKEN or configure trusted publishers for this repository/package.\" >&2\nexit 1\n"
  "publish_maturin":
    "name": "publish-pypi"
    "needs":
      - "publication_admission"
      - "resolve"
      - "prepublication"
    "if": "${{ needs.publication_admission.result == 'success' && (needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.mode == 'maturin') }}"
    "runs-on": "ubuntu-24.04"
    "timeout-minutes": 10
    "environment":
      "name": "${{ needs.resolve.outputs.environment_name }}"
    "permissions":
      "contents": "read"
      "actions": "read"
      "id-token": "write"
    "steps":
      - "name": "Checkout release commit"
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        "with":
          "fetch-depth": 0
          "ref": "${{ github.sha }}"
      - "name": "Observe CI gate once for the tagged commit"
        "if": "${{ github.event_name == 'push' && needs.resolve.outputs.wait_for_ci_command != '' }}"
        "env":
          "GITHUB_TOKEN": "${{ github.token }}"
          "TARGET_SHA": "${{ github.sha }}"
          "TARGET_REF_NAME": "${{ github.ref_name }}"
          "WAIT_FOR_CI_COMMAND": "${{ needs.resolve.outputs.wait_for_ci_command }}"
        "shell": "bash"
        "run": "set -euo pipefail\neval \"${WAIT_FOR_CI_COMMAND}\"\n"
      - "name": "Decide whether to publish PyPI distributions"
        "id": "plan"
        "if": "${{ needs.resolve.outputs.plan_command != '' }}"
        "env":
          "PLAN_COMMAND": "${{ needs.resolve.outputs.plan_command }}"
          "TARGET_SHA": "${{ github.sha }}"
        "shell": "bash"
        "run": "set -euo pipefail\neval \"${PLAN_COMMAND}\"\n"
      - "name": "Resolve publish decision"
        "id": "release"
        "shell": "bash"
        "run": "set -euo pipefail\n\npublish=\"${{ steps.plan.outputs.publish || '' }}\"\nif [[ -z \"${publish}\" ]]; then\n  publish=\"true\"\nfi\n\nif [[ \"${{ needs.resolve.outputs.enabled }}\" != \"true\" ]]; then\n  publish=\"false\"\nfi\n\nversion=\"${{ steps.plan.outputs.version || '' }}\"\nif [[ -z \"${version}\" ]]; then\n  tag=\"${{ needs.resolve.outputs.release_tag }}\"\n  version=\"${tag#v}\"\nfi\n\necho \"publish=${publish}\" >> \"$GITHUB_OUTPUT\"\necho \"version=${version}\" >> \"$GITHUB_OUTPUT\"\n"
      - "name": "Set up Python"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.setup_python == 'true' }}"
        "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
        "with":
          "python-version": "${{ needs.resolve.outputs.python_version }}"
          "cache": "pip"
          "cache-dependency-path": "${{ needs.resolve.outputs.cache_dependency_path }}"
      - "name": "Set up Rust"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.setup_rust == 'true' }}"
        "uses": "dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f"
        "with":
          "toolchain": "${{ needs.resolve.outputs.rust_toolchain }}"
      - "name": "Restore the Rust cache"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.setup_rust == 'true' }}"
        "uses": "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
      - "name": "Prepare release tree"
        "if": "${{ steps.release.outputs.publish == 'true' }}"
        "id": "release_tree"
        "env":
          "PREPARE_COMMAND": "${{ needs.resolve.outputs.prepare_command }}"
          "RELEASE_VERSION": "${{ steps.release.outputs.version }}"
        "shell": "bash"
        "run": "set -euo pipefail\nrelease_tree=\"${GITHUB_WORKSPACE}/artifacts/release-tree\"\nrm -rf \"${release_tree}\"\n\nif [[ -n \"${{ needs.resolve.outputs.prepare_command }}\" ]]; then\n  eval \"${PREPARE_COMMAND}\"\nelse\n  python3 .github/scripts/prepare_release_tree.py \\\n    --workspace-root . \\\n    --output-dir \"${release_tree}\" \\\n    --version \"${RELEASE_VERSION}\" >/dev/null\nfi\n\nrm -rf artifacts/python/build\nmkdir -p artifacts/python/build\necho \"path=${release_tree}\" >> \"${GITHUB_OUTPUT}\"\n"
      - "name": "Build manylinux wheel"
        "if": "${{ steps.release.outputs.publish == 'true' }}"
        "uses": "PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad"
        "with":
          "maturin-version": "${{ needs.resolve.outputs.maturin_version }}"
          "rust-toolchain": "${{ needs.resolve.outputs.rust_toolchain }}"
          "working-directory": "${{ steps.release_tree.outputs.path }}"
          "manylinux": "2014"
          "command": "build"
          "args": "--release --locked --manifest-path ${{ needs.resolve.outputs.manifest_path }} --interpreter ${{ needs.resolve.outputs.python_interpreter }} --compatibility pypi --out ${{ github.workspace }}/artifacts/python/build"
      - "name": "Build source distribution"
        "if": "${{ steps.release.outputs.publish == 'true' }}"
        "uses": "PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad"
        "with":
          "maturin-version": "${{ needs.resolve.outputs.maturin_version }}"
          "rust-toolchain": "${{ needs.resolve.outputs.rust_toolchain }}"
          "working-directory": "${{ steps.release_tree.outputs.path }}"
          "command": "sdist"
          "args": "--manifest-path ${{ needs.resolve.outputs.manifest_path }} --out ${{ github.workspace }}/artifacts/python/build"
      - "name": "Resolve publish auth mode"
        "id": "auth"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.publish_command == '' }}"
        "shell": "bash"
        "run": "set -euo pipefail\nmode='${{ needs.resolve.outputs.publish_auth_default }}'\ncase \"${mode}\" in\n  trusted|token) ;;\n  *)\n    echo \"Unsupported publish auth mode: ${mode}\" >&2\n    echo \"Expected one of: trusted, token\" >&2\n    exit 1\n    ;;\nesac\necho \"mode=${mode}\" >> \"$GITHUB_OUTPUT\"\n"
      - "name": "Probe package presence on PyPI"
        "id": "pypi_project"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.publish_command == '' }}"
        "shell": "bash"
        "run": "set -euo pipefail\npackage_name=''\ndist_path=\"$(find artifacts/python/build -maxdepth 1 -type f \\( -name '*.whl' -o -name '*.tar.gz' \\) | sort | head -n 1)\"\nif [[ -n \"${dist_path}\" ]]; then\n  file_name=\"$(basename \"${dist_path}\")\"\n  package_name=\"${file_name%%-*}\"\n  package_name=\"${package_name//_/-}\"\nfi\nif [[ -z \"${package_name}\" ]]; then\n  package_name='${{ github.event.repository.name }}'\nfi\nstatus_code=\"$(curl --silent --show-error --location --retry 2 --retry-delay 1 --output /dev/null --write-out '%{http_code}' \"https://pypi.org/pypi/${package_name}/json\" || true)\"\ncase \"${status_code}\" in\n  200)\n    echo \"exists=true\" >> \"$GITHUB_OUTPUT\"\n    echo \"probe_status=exists\" >> \"$GITHUB_OUTPUT\"\n    ;;\n  404)\n    echo \"exists=false\" >> \"$GITHUB_OUTPUT\"\n    echo \"probe_status=missing\" >> \"$GITHUB_OUTPUT\"\n    ;;\n  *)\n    echo \"exists=unknown\" >> \"$GITHUB_OUTPUT\"\n    echo \"probe_status=error\" >> \"$GITHUB_OUTPUT\"\n    ;;\nesac\n"
      - "name": "Publish PyPI distributions with custom command"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.publish_command != '' }}"
        "env":
          "PUBLISH_COMMAND": "${{ needs.resolve.outputs.publish_command }}"
          "PYPI_API_TOKEN": "${{ secrets.PYPI_API_TOKEN }}"
          "RELEASE_VERSION": "${{ steps.release.outputs.version }}"
        "shell": "bash"
        "run": "set -euo pipefail\neval \"${PUBLISH_COMMAND}\"\n"
      - "name": "Publish to PyPI (trusted publisher)"
        "id": "trusted_publish"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.publish_command == '' && steps.auth.outputs.mode != 'token' }}"
        "continue-on-error": true
        "uses": "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33"
        "with":
          "packages-dir": "artifacts/python/build"
          "skip-existing": "${{ needs.resolve.outputs.skip_existing == 'true' }}"
      - "name": "Validate token bootstrap prerequisites"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.publish_command == '' && (steps.auth.outputs.mode == 'token' || (steps.auth.outputs.mode != 'token' && needs.resolve.outputs.allow_token_bootstrap_on_missing == 'true' && steps.trusted_publish.outcome == 'failure' && steps.pypi_project.outputs.probe_status == 'missing')) && env.PYPI_API_TOKEN_PRESENT != 'true' }}"
        "env":
          "PYPI_API_TOKEN_PRESENT": "${{ secrets.PYPI_API_TOKEN != '' }}"
        "shell": "bash"
        "run": "set -euo pipefail\necho \"Token publish mode requires PYPI_API_TOKEN to be configured.\" >&2\nexit 1\n"
      - "name": "Publish to PyPI (token bootstrap)"
        "id": "token_publish"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.publish_command == '' && (steps.auth.outputs.mode == 'token' || (steps.auth.outputs.mode != 'token' && needs.resolve.outputs.allow_token_bootstrap_on_missing == 'true' && steps.trusted_publish.outcome == 'failure' && steps.pypi_project.outputs.probe_status == 'missing')) && env.PYPI_API_TOKEN_PRESENT == 'true' }}"
        "env":
          "PYPI_API_TOKEN_PRESENT": "${{ secrets.PYPI_API_TOKEN != '' }}"
        "uses": "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33"
        "with":
          "packages-dir": "artifacts/python/build"
          "skip-existing": "${{ needs.resolve.outputs.skip_existing == 'true' }}"
          "user": "__token__"
          "password": "${{ secrets.PYPI_API_TOKEN }}"
      - "name": "Fail on indeterminate PyPI probe"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.publish_command == '' && steps.auth.outputs.mode != 'token' && steps.trusted_publish.outcome == 'failure' && steps.pypi_project.outputs.probe_status == 'error' }}"
        "shell": "bash"
        "run": "set -euo pipefail\necho \"Trusted publish failed and PyPI probe result was indeterminate.\" >&2\necho \"Refusing token bootstrap for safety; retry later or force token mode explicitly.\" >&2\nexit 1\n"
      - "name": "Validate publish mode resolution"
        "if": "${{ steps.release.outputs.publish == 'true' && needs.resolve.outputs.publish_command == '' && steps.auth.outputs.mode != 'token' && steps.trusted_publish.outcome == 'failure' && steps.token_publish.outcome != 'success' }}"
        "shell": "bash"
        "run": "set -euo pipefail\necho \"Trusted publish failed and token bootstrap did not succeed.\" >&2\necho \"Set PYPI_API_TOKEN or configure trusted publishers for this repository/package.\" >&2\nexit 1\n"
